<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title id="page-title">404 - Pagina non trovata</title>
    <link rel="stylesheet" href="/error/style.css" />
  </head>
  <body>
    <a href="#main" id="skip-link">Salta al contenuto principale</a>

    <main id="main" tabindex="-1">
      <section id="error-container" aria-labelledby="heading">
        <p id="error-code" aria-label="Errore 404">
          <span id="code-text" aria-hidden="true">404</span>
        </p>

        <h1 id="heading">Pagina non trovata</h1>

        <p id="description">
          La pagina richiesta non è stata trovata. Potrebbe essere stata spostata, eliminata o
          l'indirizzo potrebbe non essere corretto.
        </p>

        <nav id="navigation" aria-label="Ripristino navigazione">
          <a href="/" id="home-button" class="button">Torna alla pagina iniziale</a>
        </nav>
      </section>
    </main>

    <script src="/error/script.js"></script>
  </body>
</html>
