<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--security-->

    <title>Pagina Non Trovata (404) | Desh_Art</title>

    <meta name="robots" content="noindex, nofollow" />

    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="error-container" role="main">
      <div class="error-graphic" aria-hidden="true">404</div>
      <h1>Pagina Non Trovata</h1>
      <h2>Qualcosa è andato storto.</h2>
      <p>
        La pagina che stai cercando non esiste più, è stata spostata, oppure
        il link che hai seguito potrebbe contenere un errore di battitura.
      </p>

      <div class="actions">
        <a href="/" class="btn btn-primary">Torna alla Home</a>
        <button type="button" id="back-btn" class="btn btn-border">Torna Indietro</button>
      </div>
    </main>

    <script src="/script.js"></script>
  </body>
</html>
