<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagina non trovata (404) | NomeSito</title>

    <meta name="robots" content="noindex, nofollow" />

    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="error-container" role="main">
      <div class="error-graphic" aria-hidden="true">404</div>
      <h1>Pagina Smarrita</h1>
      <h2>Qualcosa è andato storto.</h2>
      <p>
        La pagina che stai cercando non esiste più, è stata spostata o il link inserito potrebbe
        contenere un errore di battitura.
      </p>

      <div class="actions">
        <a href="/" class="btn btn-primary">Torna alla Home</a>
        <a href="javascript:history.back()" class="btn btn-border">Torna Indietro</a>
      </div>
    </main>
  </body>
</html>
