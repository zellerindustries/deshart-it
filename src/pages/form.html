<body>
    <main>
        <section aria-labelledby="contact-heading" class="max-width">
            <h1 id="contact-heading">Contatta Desh_Art</h1>
            <p>Usa questo modulo per richiedere una commissione, proporre una collaborazione o fare domande.</p>

            <form id="contact-form" method="post" action="#" aria-label="Modulo di Contatto">
                <fieldset>
                    <legend>Informazioni Personali</legend>

                    <div>
                        <label for="name">Nome Completo <span aria-hidden="true">*</span></label>
                        <input type="text" id="name" name="name" required autocomplete="name" minlength="2"
                            maxlength="70" pattern="^[a-zA-ZÀ-ÿ\s.'-]+$" title="Utilizza solo lettere"
                            placeholder="Il tuo nome completo">
                    </div>

                    <div>
                        <label for="email">Indirizzo Email <span aria-hidden="true">*</span></label>
                        <input type="email" id="email" name="email" required autocomplete="email"
                            placeholder="tu@esempio.com">
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Messaggio</legend>
                    <div>
                        <label for="message">Messaggio <span aria-hidden="true">*</span></label>
                        <textarea id="message" name="message" rows="5" required minlength="10" maxlength="5000"
                            placeholder="Descrivi la tua richiesta..."></textarea>
                    </div>
                </fieldset>

                <div class="hidden-field" aria-hidden="true">
                    <label for="bot-field">Non compilare questo campo se sei un umano:</label>
                    <input type="text" id="bot-field" name="bot-field" tabindex="-1" autocomplete="off">
                </div>

                <button type="submit" id="submit-btn">Invia Messaggio</button>

                <div id="form-status" aria-live="polite"></div>
            </form>
            <div id="form-success" hidden>
                <h2>Messaggio Inviato</h2>
                <p>Grazie per averci contattato. Fabio ti risponderà al più presto.</p>

                <a href="/" class="btn btn-cta">
                    Torna al portfolio
                </a>
            </div>
        </section>
    </main>
</body>

</html>
