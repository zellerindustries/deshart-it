name: "🐛 Bug Report"
description: "Report a problem or unexpected behavior in a project."
title: "[BUG] "
labels: ["bug"]
assignees: []

body:
  - type: markdown
    content: |
      **Describe the bug**
      A clear and concise description of what the bug is.

  - type: input
    id: steps_to_reproduce
    attributes:
      label: Steps to reproduce
      description: Describe the steps needed to reproduce the behavior
      placeholder: "1. Go to ...\n2. Click on ...\n3. Observe ..."
      required: true

  - type: input
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: What you expected to happen
      placeholder: "The feature should ..."
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser, version, etc.
      placeholder: "Windows 11, Chrome 112"
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
      placeholder: "Stack traces, screenshots, logs, etc."
      required: false
